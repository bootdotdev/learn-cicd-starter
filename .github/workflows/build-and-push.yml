name: Build & Push Notely image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1) Authenticate to Google Cloud (uses your JSON key in repo secret GCP_CREDENTIALS)
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # 2) Install gcloud and set the project
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: disco-glass-477110-u7

      # 3) Build & push using Cloud Build (uses your Dockerfile)
      - name: Cloud Build submit (build + push)
        run: |
          gcloud builds submit \
            --tag us-central1-docker.pkg.dev/disco-glass-477110-u7/notely-ar-repo/notely:latest .
