name: Build & Push Notely image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: disco-glass-477110-u7
  AR_LOCATION: us-central1
  AR_REPO: notely-ar-repo
  IMAGE_NAME: notely
  IMAGE_TAG: latest
  # Full Artifact Registry image URL we'll push to:
  IMAGE_URI: us-central1-docker.pkg.dev/disco-glass-477110-u7/notely-ar-repo/notely:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate to Google Cloud using your JSON secret
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # Install gcloud and export default creds for all gcloud commands
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}
          export_default_credentials: true

      # Helpful diagnostics so we can see exactly what's going on
      - name: gcloud info
        run: |
          gcloud --version
          echo "==== active account ===="
          gcloud auth list
          echo "==== current project ===="
          gcloud config get-value project
          echo "==== list AR repos in region $AR_LOCATION ===="
          gcloud artifacts repositories list --location="$AR_LOCATION" || true

      # Submit Docker build to Cloud Build and push to Artifact Registry
      - name: Cloud Build submit (build + push)
        run: |
          set -euo pipefail
          echo "Building and pushing: $IMAGE_URI"
          gcloud builds submit \
            --verbosity=info \
            --tag "$IMAGE_URI" .
