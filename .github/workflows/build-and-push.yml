name: Build & Push Notely image

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  GCP_PROJECT_ID: disco-glass-477110-u7
  AR_LOCATION: us-central1
  AR_REPO: notely-ar-repo
  IMAGE_NAME: notely
  IMAGE_TAG: latest
  IMAGE_URI: us-central1-docker.pkg.dev/disco-glass-477110-u7/notely-ar-repo/notely:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate using your JSON and export GOOGLE_APPLICATION_CREDENTIALS
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}
          create_credentials_file: true
          export_environment_variables: true

      # Install gcloud and set the project (no export_default_credentials)
      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.GCP_PROJECT_ID }}

      - name: gcloud info
        run: |
          gcloud --version
          gcloud auth list
          gcloud config get-value project
          gcloud artifacts repositories list --location=${{ env.AR_LOCATION }} || true

      - name: Cloud Build submit (build + push)
        run: |
          set -euo pipefail
          gcloud builds submit \
            --verbosity=info \
            --tag ${{ env.IMAGE_URI }} .
