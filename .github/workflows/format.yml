name: format

on:
    pull_request:
        branches: [main]

jobs:
    steps:
        - name: Check out code
          uses: actions/checkout@v6

        - name: Set up Go
          uses: actions/setup-go@v6
          with:
              go-version: "1.27.1"

        - name: Go Style
          run: test -z $(go fmt ./...)
