name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest    

      - name: Unit Testing Check
        run: go test -cover ./... 

      - name: Static security check
        run: gosec ./...

  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest


      - name: Formatting Check
        run: test -z $(go fmt ./...)

      - name: Formatting Check Result
        run: echo $?
      
      - name: Linting Check
        run: staticcheck ./...