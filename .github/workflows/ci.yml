name: ci

on:
  pull_request:
    branches: [main]


jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest


    steps:
      - name: check out code
        uses: actions/checkout@v4


      - name: Set up Go 
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.1'
        
      - name: tests
        run: go test ./... -cover



  style:
    name: Style Check
    runs-on: ubuntu-latest

    steps:
    - name: check out code
      uses : actions/checkout@v4
    - name: Set up Go
      uses : actions/setup-go@v5
      with:
        go-version: '1.24.1'


    - name: formating check 
      run: test -z $(go fmt ./...)

    - name: Install staticCheck 
      run: go install honnef.co/go/tools/cmd/staticcheck@latest
    
    - name: check linting
      run: staticcheck ./...