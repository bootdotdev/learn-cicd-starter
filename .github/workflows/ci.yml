name: ci

on:
    pull_request:
        branches:
            - main

jobs:
    Tests:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: setup go
              uses: actions/setup-go@v4
              with:
                  go-version: 1.22.0

            - name: install gosec
              run: go install github.com/securego/gosec/v2/cmd/gosec@latest

            - name: go tests
              run: go test -cover ./...

            - name: run gosec
              run: gosec ./...
    
    Style:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: setup go
              uses: actions/setup-go@v4
              with:
                  go-version: 1.26.0

            - name: install staticcheck
              run: go install honnef.co/go/tools/cmd/staticcheck@latest

            - name: go fmt
              run: test -z $(go fmt ./...)

            - name: run staticcheck
              run: staticcheck ./...


            