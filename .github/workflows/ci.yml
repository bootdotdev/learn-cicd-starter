name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:        ← HERE (this already exists)
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Run tests with coverage
        run: go test ./... -cover

  style:        ← SAME LEVEL as tests (no folder)
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

      - name: Check Go formatting
        run: |
          test -z "$(go fmt ./...)"