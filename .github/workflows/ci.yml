name: ci

on:
# Only run this workflow on pull requests to the main branch
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
		# Enables runner to clone code into it's FS
      - name: Check out code
        uses: actions/checkout@v4

		# Install a go environment in the runner so it can run the code
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25.1"

		# Echo the installed go version on the runner
      - name: Go Version
        run: go version
