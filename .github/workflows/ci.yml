name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/setup-go@v5

      - name: Set up Go 
        uses: actions/setup-go@v5 
        with:
          go-version: "1.26.0"

      - name: run my tests
        run: go test ./...