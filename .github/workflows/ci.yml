name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
    - name: Check out code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: "1.25.1"

    - name: Run tests
      run: go test -cover ./...

  style:
    name: format
    runs-on: ubuntu-latest
    steps:
    - name: checkout
      uses: actions/checkout@v4

    - name: setup
      uses: actions/setup-go@v5
      with:
        go-version: "1.25.1"

    - name: format
      run: test -z $(go fmt ./...)
