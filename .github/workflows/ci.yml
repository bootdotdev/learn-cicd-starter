name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

     

      - name: Run tests
        run: go test ./... -cover

      - name: Force Failure
        run: (exit 0)
  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Run style check
        run: test -z $(go fmt  ./...)

      - name: Install staticcheck
        run: go install honnef.co/go/tools/cmd/staticcheck@latest
     
      - name: Run staticcheck
        run: staticcheck ./...