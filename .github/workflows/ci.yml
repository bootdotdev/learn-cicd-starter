name: ci

on:
  pull_request:
    branches: [main]

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Unit tests
        run: go test -cover ./...

      # installing gosec and running to find potential security vulnerbilities
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: go sec ./...

  # running in parallel to the unit tests.
  # steps are common so need to duplicate it
  style:
    name: Style
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Validate formatting
        # tests that there is no output from the go fmt command
        # "go fmt" returns the list of files that were formatted / did not already meet formatting rules
        run: test -z $(go fmt ./...)

      # install staticcheck for linting our go code to spot any potential issues
      - name: Install static check
        run: go install honnef.co/go/tools/cmd/staticcheck@latest

      - name: Lint
        run: staticcheck ./...
