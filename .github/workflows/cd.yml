name: cd 

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy 
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Set up goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Build the App
        run: ./scripts/buildprod.sh

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Build and Push Docker Image
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-507211/notely-ar-repo/notely:latest .

      - name: Write release record
        env:
          IMAGE: us-central1-docker.pkg.dev/notely-507211/notely-ar-repo/notely
        run: |
          DIGEST=$(gcloud artifacts docker images describe "${IMAGE}:latest" \
            --format='value(image_summary.digest)')
          GCP_IDENTITY=$(gcloud auth list --filter=status:ACTIVE --format='value(account)')

          cat > release.json <<EOF
          {
            "git_commit": "${GITHUB_SHA}",
            "image": "${IMAGE}:latest",
            "digest": "${DIGEST}",
            "built_by": {
              "github_actor": "${GITHUB_ACTOR}",
              "gcp_identity": "${GCP_IDENTITY}"
            },
            "workflow": {
              "name": "${GITHUB_WORKFLOW}",
              "run_id": "${GITHUB_RUN_ID}",
              "url": "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            },
            "production": true,
            "reproduced": false
          }
          EOF

          echo "Release record:"
          cat release.json

      - name: Upload release record
        uses: actions/upload-artifact@v4
        with:
          name: release-record
          path: release.json

      - name: Run DB Migrations
        run: ./scripts/migrateup.sh

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-507211/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-507211 --max-instances=4
