name: cd

on:
  push:
    branches: [main]
jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Go activation
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Goose installation
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Build app
        run: ./scripts/buildprod.sh

      - name: Auth
        uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: ${{secrets.GCP_CREDENTIALS }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Use gcloud CLI
        run: gcloud info

      - name: Build Docker image
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-507821/notely-ar-repo/notely:latest .

      - name: Run migration
        run: ./scripts/migrateup.sh

      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/notely-507821/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project notely-507821 --max-instances=4
