name: cd
on:
  push:
    branches: [main]
  jobs:
    build-and-deploy:
      - name: Deploy
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v6
          - name: Setup go
            uses: actions/setup-go@v6
          - name: Build app
            run: ./scripts/buildprod.sh
