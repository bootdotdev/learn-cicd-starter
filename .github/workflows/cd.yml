name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    # Add "id-token" with the intended permissions.
    permissions:
      contents: 'read'
      id-token: 'write'
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"

      - name: Create binary
        run: scripts/buildprod.sh
        
      - id: 'auth'
        uses: 'google-github-actions/auth@v2'
        with:
            workload_identity_provider: 'projects/675821145089/locations/global/workloadIdentityPools/github/providers/my-repo'
            service_account: 'cloud-run-deployer@notely-513614.iam.gserviceaccount.com'

      - name: setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: submit to GCP AR
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-513614/notely-ar-repo/notely:latest .