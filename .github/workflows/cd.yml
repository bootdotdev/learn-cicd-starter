name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "${{ secrets.DATABASE_URL }}"

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: "1.26.0"

      - name: Set up Goose
        run: go install github.com/pressly/goose/v3/cmd/goose@latest

      - name: Build app
        run: scripts/buildprod.sh

      - name: Migrate database changes
        run: scripts/migrateup.sh

        
      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: "Set up GCloud"
        uses: "google-github-actions/setup-gcloud@v3"

      - name: "Push to GCloud Artifact Registry"
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/project-19cb683f-1efc-4bf6-9ce/notely-ar-repo/notely:latest .

      - name: "Deploy to GCloud"
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/project-19cb683f-1efc-4bf6-9ce/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project project-19cb683f-1efc-4bf6-9ce --max-instances 4