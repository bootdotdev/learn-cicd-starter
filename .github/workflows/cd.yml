name: CD

on:
  push:
    branches: [ main ]

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Make build script executable
        run: chmod +x scripts/buildprod.sh

      - name: Build (prod)
        run: GOFLAGS=-mod=mod scripts/buildprod.sh

      # --- Authenticate to Google Cloud using your existing secret
      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      # --- Install and configure gcloud CLI
      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: disco-glass-477110-u7

      # --- Deploy to Cloud Run
      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy notely \
            --image us-central1-docker.pkg.dev/disco-glass-477110-u7/notely-ar-repo/notely:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --quiet
