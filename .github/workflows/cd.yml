name: ci

on:
  push:
    branches: [main]

jobs:
  Deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Go 
        uses: actions/setup-go@v5 
        with:
          go-version: "1.26.0"

      - name: Build Application
        run: |
           chmod +x scripts/buildprod.sh
           ./scripts/buildprod.sh

      

        
            
