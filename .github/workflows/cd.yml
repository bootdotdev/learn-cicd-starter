name: cd

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up GO toolchain
        uses: actions/setup-go@v6
        with:
          go-version: "1.27.1"
      - name: Set up Goose db migration tool
        run: go install github.com/pressly/goose/v3/cmd/goose@latest
      - name: Build the app with PROD variables
        run: ./scripts/buildprod.sh

      - name: Authenticate to Google Cloud
        id: auth
        uses: google-github-actions/auth@v2
        with: 
          credentials_json: '${{ secrets.GCP_CREDENTIALS }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Use gcloud CLI
        run: gcloud info

      - name: Build and push Docker image to Artifact Registry
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/project-d1b773db-4f9a-4f2b-a18/notely-ar-repo/notely:latest .
      - name: Run DB migrations TURSO
        run: ./scripts/migrateup.sh 
      - name: Deploy to Cloud Run
        run: gcloud run deploy notely --image us-central1-docker.pkg.dev/project-d1b773db-4f9a-4f2b-a18/notely-ar-repo/notely:latest --region us-central1 --allow-unauthenticated --project project-d1b773db-4f9a-4f2b-a18  --max-instances=4
           
