name: cd

on:
    push:
        branches:
            - main

jobs: 
    Deploy:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v3

            - name: setup go
              uses: actions/setup-go@v4
              with:
                  go-version: 1.22.0

            - name: build the app
              run: ./scripts/buildprod.sh
