name: CD Workflow

on:
  push: 
    branches: [main]

jobs:
  name: Deploy
  runs-on: ubuntu:latest

  steps: 
   - name: Checkout
     uses: actions/checkout@v4

   - name: Set up Go
     uses: actions/setup-go@v5
     with:
      go_version: "1.25.1"
  
   - name: Run Build Script
     run: ./scripts/buildprod.sh