name: cd

on:
  push:
    branches: [main]

jobs:
  tests:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - id: "auth"
        uses: "google-github-actions/auth@v2"
        with:
          credentials_json: "${{ secrets.GCP_CREDENTIALS }}"

      - name: "Set up Cloud SDK"
        uses: "google-github-actions/setup-gcloud@v3"

      - name: Run Build
        run: scripts/buildprod.sh

      - name: Run build and push image to gcloud
        run: gcloud builds submit --tag us-central1-docker.pkg.dev/notely-471317/notely-ar-repo/notely:TAG .
