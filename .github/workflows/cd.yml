name: CD

on:
  push:
    branches: [ main ]

jobs:
  Deploy:
    runs-on: ubuntu-latest

    env:
      PROJECT_ID: disco-glass-477110-u7         
      REGION: us-central1                        
      REPO_NAME: notely-ar-repo                  
      IMAGE_NAME: notely
      IMAGE_TAG: latest
      IMAGE_URI: us-central1-docker.pkg.dev/disco-glass-477110-u7/notely-ar-repo/notely:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Make build script executable
        run: chmod +x scripts/buildprod.sh

      - name: Build (prod)
        run: GOFLAGS=-mod=mod scripts/buildprod.sh

      - name: Auth to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          # You already have this secret set
          credentials_json: ${{ secrets.GCP_CREDENTIALS }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Debug gcloud context
        run: |
          set -x
          gcloud --version
          gcloud auth list
          gcloud config get-value project
          echo "IMAGE_URI=${IMAGE_URI}"
          echo "REGION=${REGION}"

      - name: Deploy to Cloud Run
        run: |
          set -euo pipefail
          gcloud run deploy notely \
            --image "${IMAGE_URI}" \
            --region "${REGION}" \
            --platform managed \
            --allow-unauthenticated \
            --quiet \
            --verbosity=info
