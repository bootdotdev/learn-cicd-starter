name: CD

on:
  push:
    branches: [ main ]

jobs:
  Deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Make build script executable
        run: chmod +x scripts/buildprod.sh

      - name: Build (prod)
        run: GOFLAGS=-mod=mod scripts/buildprod.sh

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy notely \
            --image us-central1-docker.pkg.dev/disco-glass-477110-u7/notely-ar-repo/notely:latest \
            --region us-central1 \
            --platform managed \
            --allow-unauthenticated \
            --quiet
